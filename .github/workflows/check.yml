name: Check and Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install MoonBit on Unix
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Install MoonBit on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Check toolchain
        run: moon version --all

      - name: Check
        run: moon check --target all --deny-warn

      - name: Test all targets
        if: ${{ matrix.os != 'windows-latest' }}
        run: moon test --target all --deny-warn

      - name: Test portable targets on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          moon test --target wasm --deny-warn
          moon test --target wasm-gc --deny-warn
          moon test --target js --deny-warn

      - name: Build native CLI
        if: ${{ matrix.os != 'windows-latest' }}
        run: moon build --target native

      - name: Build acceptance examples
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: |
          moon run --target native cmd/main -- check examples/basic
          moon run --target native cmd/main -- build examples/basic
          moon run --target native cmd/main -- check examples/advanced
          moon run --target native cmd/main -- build examples/advanced
          moon run --target native cmd/main -- build examples/advanced | grep "跳过渲染 7 个"
          test -f examples/basic/book/assets/pipeline.svg
          test -f examples/advanced/book/logo.svg
          test -f examples/advanced/book/theme/accent.css

      - name: Verify CLI failure status
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: |
          if moon run --target native cmd/main -- check examples/not-found; then
            echo "check unexpectedly succeeded"
            exit 1
          fi

      - name: Verify formatting
        run: moon fmt --check

      - name: Verify interfaces
        run: moon info
